name: Deploy receitas-headless to Integrator ICP VPS

on:
  push:
    branches:
      - main # Dispara ao fazer push na branch main
  workflow_dispatch: # Permite disparar manualmente ou via webhook externo do WordPress!

jobs:
  web-deploy:
    name: Build & Deploy via FTP to Integrator ICP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Use Node.js
        uses: actions/setup-node@v4
        with:
          node-style: 'npm'
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Project (Gera HTML/CSS estáticos buscando dados do WP)
        run: npm run build

      - name: 🚀 Deploy via SCP/SFTP to Integrator ICP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: 'dist/*'
          target: '/etc/icontainer/apps/openresty/openresty/www/sites/descomplicandoreceitas.com.br/index/'
          strip_components: 1
